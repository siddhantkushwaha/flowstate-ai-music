services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SPOTIFY_CLIENT_ID: ${VITE_SPOTIFY_CLIENT_ID:-}
        VITE_API_BASE_URL: ""
    image: flowstate-ai-music:latest
    container_name: flowstate_app
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - FLASK_ENV=production
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemma-2-27b-it}
      - DB_PATH=/app/data/flowstate.sqlite3
    env_file:
      - path: .env
        required: false
    volumes:
      - flowstate_data:/app/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

volumes:
  flowstate_data:
